server:
  port: 8108
spring:
  application:
    name: sword-shield-payment
  datasource:
    url: jdbc:mysql://localhost:3306/sword_shield?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: localhost:8848
      config:
        enabled: false
        import-check:
          enabled: false

payment:
  order-prefix: ${PAYMENT_ORDER_PREFIX:XHLJ}
  seed: ${PAYMENT_SEED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
