server:
  port: 8105
spring:
  config:
    import: "classpath:common.yml,classpath:observability.yml,classpath:dubbo.yml"
  application:
    name: sword-shield-file
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
springdoc:
  api-docs:
    path: /api/file/v3/api-docs
minio:
  # 有 MinIO 时保持 true；离线演示可设 MINIO_ENABLED=false 落本地磁盘
  enabled: ${MINIO_ENABLED:true}
  local-dir: ${FILE_LOCAL_DIR:./uploads}
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  accessKey: ${MINIO_ACCESS_KEY:admin}
  secretKey: ${MINIO_SECRET_KEY:admin123456}
  bucket: ${MINIO_BUCKET:assets}
