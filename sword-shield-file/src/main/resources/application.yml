server:
  port: 8105
spring:
  application:
    name: sword-shield-file
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: jdbc:mysql://localhost:3306/sword_shield?useSSL=false&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: localhost:8848
      config:
        import-check:
          enabled: false
minio:
  # 本地演示默认使用磁盘存储；有 MinIO 时将 MINIO_ENABLED 设为 true
  enabled: ${MINIO_ENABLED:false}
  local-dir: ${FILE_LOCAL_DIR:./uploads}
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  accessKey: ${MINIO_ACCESS_KEY:admin}
  secretKey: ${MINIO_SECRET_KEY:admin123456}
  bucket: ${MINIO_BUCKET:assets}

