# 本地无 Nacos 的一键演示配置：
#   java -jar sword-shield-gateway/target/*.jar --spring.profiles.active=local
# 各微服务以 --spring.cloud.nacos.discovery.enabled=false 启动即可。
spring:
  cloud:
    nacos:
      discovery:
        enabled: false
    gateway:
      routes:
        - id: user
          uri: http://localhost:8101
          predicates:
            - Path=/api/user/**
        - id: activity
          uri: http://localhost:8102
          predicates:
            - Path=/api/activity/**
        - id: content
          uri: http://localhost:8103
          predicates:
            - Path=/api/content/**
        - id: interaction
          uri: http://localhost:8104
          predicates:
            - Path=/api/interaction/**
        - id: file
          uri: http://localhost:8105
          predicates:
            - Path=/api/file/**
        - id: admin
          uri: http://localhost:8106
          predicates:
            - Path=/api/admin/**
        - id: ai
          uri: http://localhost:8107
          predicates:
            - Path=/api/ai/**
        - id: payment
          uri: http://localhost:8108
          predicates:
            - Path=/api/payment/**
logging:
  level:
    com.swordshield: DEBUG
